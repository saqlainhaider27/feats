<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="projGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <pattern id="projGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#projGrad)" />
  <rect width="800" height="500" fill="url(#projGrid)" />

  <!-- Center Card Area -->
  <g transform="translate(400, 220)">
    <!-- Decorative Circle Behind Icon -->
    <circle cx="0" cy="-15" r="60" fill="#1e3a8a" fill-opacity="0.3" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1.5" />
    
    <!-- Blueprint / Structural Pipes Icon -->
    <g transform="translate(-28, -43)" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="8" width="52" height="40" rx="6" fill="#0f172a" fill-opacity="0.5" />
      <path d="M 6 36 L 20 22 L 32 32 L 40 24 L 50 36" />
      <circle cx="18" cy="18" r="4" fill="#60a5fa" fill-opacity="0.6" />
    </g>

    <!-- Main Heading -->
    <text x="0" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">
      Project Photo Placeholder
    </text>

    <!-- Badge / Subtitle -->
    <rect x="-160" y="96" width="320" height="30" rx="15" fill="#0f172a" stroke="#60a5fa" stroke-opacity="0.2" stroke-width="1" />
    <text x="0" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
      Custom Image Slot • Configure in <tspan fill="#60a5fa">imagesData.js</tspan>
    </text>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 24 40 L 24 24 L 40 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.4" />
  <path d="M 776 40 L 776 24 L 760 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.4" />
  <path d="M 24 460 L 24 476 L 40 476" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.4" />
  <path d="M 776 460 L 776 476 L 760 476" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.4" />
</svg>
